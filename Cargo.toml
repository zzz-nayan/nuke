[package]
name = "nuke"
version = "0.1.1"
edition = "2024"
description = "A fast, interactive directory-cleaner CLI for developers"
repository = "https://github.com/zzz-nayan/nuke"
homepage = "https://github.com/zzz-nayan/nuke"
readme = "README.md"
license = "MIT"
keywords = ["cli", "cleaner", "disk-usage", "developer-tools", "node_modules"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
dialoguer = "0.11"
indicatif = "0.17"
comfy-table = "7"
bytesize = "1"
console = "0.15"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
